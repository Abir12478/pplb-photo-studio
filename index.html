
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PPLB Premium Photo Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#071b16;color:white;font-family:Arial,sans-serif}
header{padding:18px;background:#0c2b21;text-align:center;border-bottom:1px solid #315344}
header h1{color:#28d49a;margin:0}
header p{color:#b8cfc3;margin:6px}
main{max-width:1200px;margin:auto;padding:12px}
.panel{background:#102820;border:1px solid #315344;border-radius:13px;padding:14px;margin-bottom:14px}
h2{font-size:17px}
label{display:block;color:#b8cfc3;margin:10px 0 5px;font-size:13px}
input,select{width:100%;padding:11px;background:#071b16;color:white;border:1px solid #456657;border-radius:8px}
button{padding:10px 14px;background:#27c995;border:0;border-radius:8px;font-weight:bold;cursor:pointer}
button.secondary{background:#244438;color:white}
.row{display:flex;gap:9px}
.row>*{flex:1;min-width:0}
canvas{width:100%;max-width:650px;height:auto;display:block;margin:auto;background:#104333}
.preview{background:#0b211a;padding:10px;border-radius:12px}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.design{background:#17372c;border:2px solid transparent;color:white;padding:6px;border-radius:9px;text-align:left;min-width:0}
.design.active{border-color:#27d995}
.design b{font-size:11px;display:block;margin-top:6px}
.thumb{height:105px;background:var(--bg);position:relative;overflow:hidden;border-radius:5px}
.pic{position:absolute;background:linear-gradient(135deg,#8da68b,#314e3e);background-size:cover}
.txt{position:absolute;background:var(--fg)}
.l0 .pic{inset:5% 5% 29%}.l0 .txt{left:7%;bottom:13%;width:45%;height:5%}
.l1 .pic{inset:0}.l1:after{content:"";position:absolute;inset:45% 0 0;background:linear-gradient(transparent,#101010)}
.l1 .txt{left:7%;bottom:12%;width:55%;height:7%;background:white}
.l2 .pic{right:5%;top:5%;width:59%;height:90%}.l2 .txt{left:5%;top:35%;width:30%;height:6%}
.l3 .pic{left:0;top:0;width:62%;height:100%}.l3 .txt{right:5%;top:40%;width:25%;height:7%}
.l4 .pic{left:10%;top:8%;width:80%;height:68%}.l4 .txt{left:20%;bottom:9%;width:60%;height:6%;background:#333}
.l5 .pic{left:9%;top:18%;width:82%;height:65%}.l5 .txt{left:9%;top:7%;width:50%;height:5%}
.l6 .pic{inset:0}.l6 .txt{left:5%;top:12%;width:75%;height:12%;background:white;opacity:.9}
.l7 .pic{left:10%;top:20%;width:80%;height:65%}.l7 .txt{left:10%;top:8%;width:45%;height:5%}
.l8 .pic{left:25%;top:5%;width:50%;height:65%;border-radius:50%}.l8 .txt{left:20%;bottom:10%;width:60%;height:6%}
.l9 .pic{right:0;top:0;width:75%;height:100%}.l9 .txt{left:5%;top:40%;width:15%;height:8%}
.l10 .pic{left:5%;top:5%;width:90%;height:55%}.l10 .txt{left:5%;bottom:10%;width:90%;height:22%;background:var(--fg);opacity:.7}
.l11 .pic{left:8%;top:12%;width:84%;height:76%;border:5px solid #222}
@media(max-width:600px){.gallery{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header>
<h1>🌿 PPLB PHOTO STUDIO</h1>
<p>প্রকৃতির পথে Low Budget | Premium Travel Memories</p>
</header>
<main>
<div class="panel">
<h2>✏️ Photo Editor</h2>
<label>আপনার ছবি নির্বাচন</label>
<input type="file" id="photo" accept="image/*">
<label>ভ্রমণস্থানের নাম</label>
<input id="place" value="স্বপ্নপুরী">
<div class="row">
<div><label>সিরিয়াল</label><input id="serial" value="১৫"></div>
<div><label>সাল</label><input id="year" value="২০২৬"></div>
</div>
<label>ক্যাপশন</label>
<input id="caption" value="প্রকৃতির পথে Low Budget">
<div class="row">
<div><label>ব্যাকগ্রাউন্ড</label><input type="color" id="bg" value="#104333"></div>
<div><label>লেখার রং</label><input type="color" id="fg" value="#ffffff"></div>
<div><label>অ্যাকসেন্ট</label><input type="color" id="ac" value="#27c995"></div>
</div>
<label>ছবির Zoom</label>
<input type="range" id="zoom" min="100" max="220" value="100">
<label>ডাউনলোড সাইজ</label>
<select id="size">
<option value="1080">Square 1080 × 1080</option>
<option value="1350">Portrait 1080 × 1350</option>
<option value="1920">Story 1080 × 1920</option>
</select>
</div>

<div class="panel">
<h2>🖼️ Live Preview</h2>
<div class="preview">
<canvas id="canvas" width="1080" height="1080"></canvas>
</div>
<p id="selected">Design 001</p>
<button onclick="download()">⬇ PNG Download</button>
<button class="secondary" onclick="resetAll()">Reset</button>
</div>

<div class="panel">
<h2>✨ ১২০০+ Premium Design Library</h2>
<input id="search" placeholder="Search: Cinematic, Luxury, Nature...">
<p style="color:#27c995;font-size:12px">
১২টি আলাদা Layout × ১০টি Color × ১০টি Style
</p>
<div class="gallery" id="gallery"></div>
<button style="margin-top:12px" onclick="showMore()">আরও ডিজাইন দেখুন</button>
</div>
</main>

<script>
const $=id=>document.getElementById(id);
const c=$('canvas'),ctx=c.getContext('2d');

const layouts=[
'Classic PPLB','Cinematic','Luxury Editorial',
'Split Layout','Polaroid','Vintage Postcard',
'Magazine Cover','Minimal','Circle Portrait',
'Side Panel','Photo Collage','Film Frame'
];

const colors=[
['#104333','#ffffff','#27c995'],
['#101820','#ffffff','#d8b56d'],
['#201a35','#ffffff','#c39aff'],
['#38251d','#fff8ee','#e5a36d'],
['#142d3c','#ffffff','#78c9e8'],
['#292d32','#ffffff','#f0c75e'],
['#432735','#fff5fa','#ff91b5'],
['#263b2b','#ffffff','#b8dc8d'],
['#e9e4d8','#202b26','#397b62'],
['#14284a','#ffffff','#73a7ff']
];

let photo=null,active=0,limit=36;

const designs=Array.from({length:1200},(_,i)=>({
id:i+1,layout:i%12,color:Math.floor(i/12)%10,
font:Math.floor(i/120)%10
}));

function image(x,y,w,h,circle=false){
if(!photo){
ctx.fillStyle='#708e7d';
ctx.fillRect(x,y,w,h);
ctx.fillStyle='white';
ctx.font='bold 35px sans-serif';
ctx.fillText('PPLB TRAVEL',x+25,y+h/2);
return;
}
let z=+$('zoom').value/100;
let scale=Math.max(w/photo.width,h/photo.height)*z;
let sw=w/scale,sh=h/scale;
let sx=(photo.width-sw)/2,sy=(photo.height-sh)/2;
ctx.save();
ctx.beginPath();
if(circle)ctx.arc(x+w/2,y+h/2,Math.min(w,h)/2,0,Math.PI*2);
else ctx.rect(x,y,w,h);
ctx.clip();
ctx.drawImage(photo,sx,sy,sw,sh,x,y,w,h);
ctx.restore();
}

function title(x,y,size,color,maxWidth){
ctx.fillStyle=color;
ctx.font='bold '+size+'px sans-serif';
let t=$('place').value;
while(ctx.measureText(t).width>maxWidth&&t.length>2)t=t.slice(0,-2);
ctx.fillText(t,x,y);
}

function draw(){
let L=designs[active].layout;
let bg=$('bg').value,fg=$('fg').value,ac=$('ac').value;
let h=+$('size').value;
c.width=1080;c.height=h;
ctx.fillStyle=bg;
ctx.fillRect(0,0,1080,h);

let foot=h*.18,m=50;

if(L===0){
// Classic
image(m,m,980,h-foot-m);
title(50,h-foot*.55,65,fg,700);
ctx.fillStyle=ac;ctx.font='bold 40px sans-serif';
ctx.fillText('🌿 PPLB',850,h-foot*.55);
}
else if(L===1){
// Cinematic
image(0,0,1080,h);
let g=ctx.createLinearGradient(0,h*.48,0,h);
g.addColorStop(0,'transparent');g.addColorStop(1,'rgba(0,0,0,.85)');
ctx.fillStyle=g;ctx.fillRect(0,0,1080,h);
title(65,h-220,95,'white',900);
ctx.fillStyle='white';ctx.font='35px sans-serif';
ctx.fillText('PPLB  |  '+$('year').value,65,h-140);
}
else if(L===2){
// Luxury Editorial
ctx.fillStyle='#e9e4d8';ctx.fillRect(0,0,1080,h);
image(390,65,630,h-130);
ctx.fillStyle='#202b26';ctx.font='bold 30px sans-serif';
ctx.fillText('TRAVEL JOURNAL',65,130);
ctx.font='bold 65px sans-serif';
title(65,h*.48,65,'#202b26',300);
ctx.fillRect(65,h*.55,220,4);
ctx.font='28px sans-serif';ctx.fillText('PPLB · '+$('year').value,65,h*.62);
}
else if(L===3){
// Split
image(0,0,660,h);
ctx.fillStyle=bg;ctx.fillRect(660,0,420,h);
title(700,h*.42,55,fg,340);
ctx.fillStyle=ac;ctx.font='bold 34px sans-serif';
ctx.fillText('PPLB',700,h*.54);
ctx.font='25px sans-serif';ctx.fillText($('year').value,700,h*.61);
}
else if(L===4){
// Polaroid
ctx.fillStyle='#dedbd2';ctx.fillRect(0,0,1080,h);
ctx.shadowColor='#0008';ctx.shadowBlur=25;
ctx.fillStyle='white';ctx.fillRect(100,60,880,h-120);
ctx.shadowBlur=0;
image(135,95,810,h-330);
ctx.fillStyle='#222';ctx.font='bold 60px sans-serif';
title(150,h-165,60,'#222',700);
ctx.font='27px sans-serif';ctx.fillText('PPLB · '+$('year').value,150,h-105);
}
else if(L===5){
// Vintage postcard
ctx.fillStyle='#f0e4ca';ctx.fillRect(0,0,1080,h);
ctx.strokeStyle='#8a6b43';ctx.lineWidth=12;
ctx.strokeRect(30,30,1020,h-60);
ctx.fillStyle='#684b2b';ctx.font='bold 35px sans-serif';
ctx.fillText('GREETINGS FROM',75,100);
image(75,145,930,h-390);
title(75,h-190,60,'#684b2b',850);
ctx.font='28px sans-serif';ctx.fillText('PPLB TRAVEL · '+$('year').value,75,h-105);
}
else if(L===6){
// Magazine
image(0,0,1080,h);
ctx.fillStyle='rgba(0,0,0,.32)';ctx.fillRect(0,0,1080,h);
ctx.fillStyle='white';ctx.font='bold 38px sans-serif';
ctx.fillText('PPLB TRAVEL MAGAZINE',55,100);
title(55,230,100,'white',950);
ctx.font='35px sans-serif';ctx.fillText('EXPLORE BANGLADESH',55,h-90);
}
else if(L===7){
// Minimal
ctx.fillStyle='#f3f0e8';ctx.fillRect(0,0,1080,h);
ctx.fillStyle='#243b30';ctx.font='bold 30px sans-serif';
ctx.fillText('PPLB — TRAVEL STORIES',70,100);
image(90,160,900,h*.62);
title(90,h*.87,65,'#243b30',850);
}
else if(L===8){
// Circle portrait
ctx.fillStyle=bg;ctx.fillRect(0,0,1080,h);
ctx.strokeStyle=ac;ctx.lineWidth=12;
ctx.beginPath();ctx.arc(540,h*.40,350,0,Math.PI*2);ctx.stroke();
image(195,h*.40-345,690,690,true);
ctx.textAlign='center';
title(150,h*.85,75,fg,780);
ctx.fillStyle=ac;ctx.font='bold 35px sans-serif';
ctx.fillText('PPLB · '+$('year').value,540,h*.94);
ctx.textAlign='left';
}
else if(L===9){
// Side panel
image(260,0,820,h);
ctx.fillStyle=bg;ctx.fillRect(0,0,260,h);
ctx.save();ctx.translate(130,h*.75);ctx.rotate(-Math.PI/2);
ctx.fillStyle=fg;ctx.font='bold 65px sans-serif';
ctx.textAlign='center';ctx.fillText($('place').value,0,0);
ctx.restore();
ctx.fillStyle=ac;ctx.font='bold 30px sans-serif';
ctx.fillText('PPLB',45,h-75);
}
else if(L===10){
// Photo collage
image(0,0,1080,h*.65);
image(0,h*.68,1080,h*.32);
ctx.fillStyle='rgba(0,0,0,.65)';
ctx.fillRect(0,h*.65,1080,h*.35);
title(55,h*.83,75,'white',900);
ctx.fillStyle=ac;ctx.font='bold 30px sans-serif';
ctx.fillText('PPLB · '+$('year').value,55,h*.92);
}
else{
// Film frame
ctx.fillStyle='#151515';ctx.fillRect(0,0,1080,h);
image(65,100,950,h-200);
ctx.fillStyle='white';
for(let i=0;i<12;i++){
ctx.fillRect(10+i*95,25,48,38);
ctx.fillRect(10+i*95,h-63,48,38);
}
ctx.fillStyle=ac;ctx.font='bold 40px sans-serif';
ctx.fillText('PPLB FILM • '+$('year').value,85,h-90);
title(85,165,55,'white',850);
}

if(L!==8&&L!==9&&L!==2&&L!==4&&L!==5&&L!==6&&L!==7&&L!==10&&L!==11){
ctx.fillStyle=fg;ctx.font='30px sans-serif';
ctx.fillText($('serial').value+' · '+$('year').value,50,h-40);
}
$('selected').textContent='Selected: '+layouts[L]+' · Design '+designs[active].id;
}

function gallery(){
let g=$('gallery');g.innerHTML='';
let term=$('search').value.toLowerCase();
designs.filter(d=>(layouts[d.layout]+' '+d.id).toLowerCase().includes(term)).slice(0,limit).forEach(d=>{
let b=document.createElement('button');
b.className='design'+(active===d.id-1?' active':'');
let p=colors[d.color];
b.innerHTML='<div class="thumb l'+d.layout+'" style="--bg:'+p[0]+';--fg:'+p[1]+';--ac:'+p[2]+'"><div class="pic"></div><div class="txt"></div></div><b>'+layouts[d.layout]+'</b><small>#'+d.id+' · '+(d.font+1)+'</small>';
b.onclick=()=>{
active=d.id-1;
$('bg').value=p[0];$('fg').value=p[1];$('ac').value=p[2];
draw();gallery();
};
g.appendChild(b);
});
}

$('photo').onchange=e=>{
let f=e.target.files[0];if(!f)return;
let im=new Image();
im.onload=()=>{photo=im;draw()};
im.src=URL.createObjectURL(f);
};
['place','serial','year','caption','bg','fg','ac','zoom','size'].forEach(id=>{
$(id).addEventListener('input',draw);
});
$('search').oninput=()=>{limit=36;gallery()};
function showMore(){limit+=36;gallery()}
function download(){
draw();
let a=document.createElement('a');
a.download='PPLB-'+layouts[designs[active].layout]+'.png';
a.href=c.toDataURL('image/png');a.click();
}
function resetAll(){
$('place').value='স্বপ্নপুরী';
$('serial').value='১৫';$('year').value='২০২৬';
$('bg').value='#104333';$('fg').value='#ffffff';
$('ac').value='#27c995';$('zoom').value=100;
$('size').value='1080';draw();
}
draw();gallery();
</script>
</body>
</html>
